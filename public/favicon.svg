<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Monogram Electric Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle Inner Grid Trace -->
  <path d="M6 64 H122 M64 6 V122" stroke="#27272a" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Monogram M & I Geometry -->
  <g filter="url(#neonGlow)">
    <!-- Left Leg of M -->
    <path d="M30 92 V40 L50 64" stroke="url(#logoGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Leg of M -->
    <path d="M98 92 V40 L78 64" stroke="url(#logoGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center I Core Column (Terminal Cursor) -->
    <path d="M64 56 V92" stroke="#10b981" stroke-width="9" stroke-linecap="round" />

    <!-- Terminal Pulse Radar Node at top of I -->
    <circle cx="64" cy="34" r="5.5" fill="#22d3ee" />
    <circle cx="64" cy="34" r="9" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  </g>
</svg>
